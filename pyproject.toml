[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socks5-bench"
version = "1.1.0"
description = "Benchmark and health-check SOCKS5 proxies from the command line."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "proxybrad", email = "marketing@proxyhat.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Environment :: Console",
]
dependencies = [
    "click>=8.0",
    "aiohttp>=3.9",
    "aiohttp-socks>=0.8",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/ProxyHatCom/socks5-bench"
Repository = "https://github.com/ProxyHatCom/socks5-bench"
Issues = "https://github.com/ProxyHatCom/socks5-bench/issues"

[project.scripts]
socks5-bench = "socks5_bench.cli:main"

[tool.setuptools.packages.find]
include = ["socks5_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
